name: Build iOS (unsigned IPA)

on:
  push:
    branches: [ main, master ]
    paths: [ 'ios/**', '.github/workflows/ios.yml' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build (no signing)
        working-directory: ios
        run: |
          xcodebuild -project LYNKO.xcodeproj -scheme LYNKO -configuration Release \
            -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build

      - name: Make IPA
        working-directory: ios
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/LYNKO.app Payload/
          zip -qr LYNKO-iOS.ipa Payload

      - name: Upload IPA (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: LYNKO-iOS-IPA
          path: ios/LYNKO-iOS.ipa
          if-no-files-found: error

      # prerelease + not "latest", so the Android in-app updater is not affected
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-${{ github.run_number }}
          name: LYNKO iOS build ${{ github.run_number }} (unsigned, sideload)
          files: ios/LYNKO-iOS.ipa
          prerelease: true
          make_latest: "false"
