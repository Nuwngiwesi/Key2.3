name: Build APK

on:
  push:
    branches: [ main, master ]
    paths-ignore: [ 'ios/**', '.github/workflows/ios.yml' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # same signing key every time = the installed app can be updated in place
      - name: Prepare signing key
        run: |
          if [ -f lynko.keystore.b64 ]; then
            base64 -d lynko.keystore.b64 > lynko.jks
          else
            echo "::warning::lynko.keystore.b64 missing - APK will use a random key and cannot update an installed app"
          fi

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: LYNKO-Keyboard-APK
          path: build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # the app checks this release and offers "Download & install"
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: LYNKO Keyboard build ${{ github.run_number }}
          files: build/outputs/apk/debug/*.apk
          make_latest: "true"
